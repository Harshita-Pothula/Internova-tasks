<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4 - Student Registration Form</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <p>Fields marked with * are required.</p>

    <form action="#" method="post">

        <fieldset>
            <legend>Personal Details</legend>

            <p>
                <label for="fullname">Full Name *</label><br>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
            </p>

            <p>
                <label for="email">Email *</label><br>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
            </p>

            <p>
                <label for="phone">Phone Number *</label><br>
                <input type="tel" id="phone" name="phone" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>
            </p>

            <p>
                <label for="dob">Date of Birth *</label><br>
                <input type="date" id="dob" name="dob" required>
            </p>

            <!-- Radio buttons: only one option can be selected -->
            <p>
                Gender *<br>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>
                <input type="radio" id="other" name="gender" value="other">
                <label for="other">Other</label>
            </p>
        </fieldset>

        <br>

        <fieldset>
            <legend>Course Details</legend>

            <!-- Dropdown menu -->
            <p>
                <label for="course">Course Selection *</label><br>
                <select id="course" name="course" required>
                    <option value="">-- Select a course --</option>
                    <option value="webdev">Web Development</option>
                    <option value="python">Python Programming</option>
                    <option value="datascience">Data Science</option>
                    <option value="cybersecurity">Cyber Security</option>
                </select>
            </p>

            <!-- Radio buttons for study mode -->
            <p>
                Mode of Study *<br>
                <input type="radio" id="online" name="mode" value="online" required>
                <label for="online">Online</label>
                <input type="radio" id="offline" name="mode" value="offline">
                <label for="offline">Offline</label>
            </p>

            <!-- Checkboxes: multiple options can be selected -->
            <p>
                Skills you already know:<br>
                <input type="checkbox" id="skill-html" name="skills" value="html">
                <label for="skill-html">HTML</label>
                <input type="checkbox" id="skill-css" name="skills" value="css">
                <label for="skill-css">CSS</label>
                <input type="checkbox" id="skill-js" name="skills" value="javascript">
                <label for="skill-js">JavaScript</label>
                <input type="checkbox" id="skill-python" name="skills" value="python">
                <label for="skill-python">Python</label>
            </p>
        </fieldset>

        <br>

        <fieldset>
            <legend>Contact Details</legend>

            <p>
                <label for="address">Address *</label><br>
                <textarea id="address" name="address" rows="4" cols="40" placeholder="Enter your full address" required></textarea>
            </p>

            <p>
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I agree to the terms and conditions *</label>
            </p>
        </fieldset>

        <br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>

    <p><a href="index.html">Back to Home</a></p>
</body>
</html>
